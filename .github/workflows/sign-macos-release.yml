# Fork-side macOS signing pipeline.
#
# Lives on KevinGriffin-new/OpenCADStudio ONLY — never merge into upstream.
# Watches upstream (HakanSeven12/OpenCADStudio) for newly published releases,
# builds the release tag, signs + notarizes with the Developer ID stored in
# THIS fork's secrets, and publishes the dmg as a release ON THIS FORK.
# Upstream can then download it and attach it to the official release
# manually (the notarization staple travels with the dmg, so re-hosting it
# is fine) — no collaborator access or cross-repo token needed anywhere.
#
# Rationale: upstream has no Apple developer account (releases are ad-hoc
# signed, which breaks the QuickLook appex and Gatekeeper, see #365). Keeping
# the certificate in the fork's secrets means no workflow outside this repo
# can touch the signing identity.
#
# Only tags cut after PR #405 merged (2026-07-17) can be built: earlier tags
# don't contain packaging/build_macos_signed.sh. Older tags are skipped with
# a note in the job summary rather than failing.
#
# The build deliberately runs without OCS_PATREON_TOKEN — that secret belongs
# to upstream and is not mirrored here. src/patreon.rs reads it via
# option_env!, so the build succeeds and the Patreon-gated features are
# simply inactive. This is disclosed in the release notes.
#
# Scheduled runs only happen while Actions is enabled on this fork, and
# GitHub disables fork cron after 60 days of repository inactivity (it emails
# a re-enable link). workflow_dispatch is the reliable path.
#
# Required secrets (set with `gh secret set -R KevinGriffin-new/OpenCADStudio`):
#   MACOS_CERT_P12        base64 of the "Developer ID Application" cert+key .p12
#   MACOS_CERT_PASSWORD   passphrase chosen when exporting the .p12
#   APPLE_ID              Apple ID email for notarization
#   APPLE_APP_PASSWORD    app-specific password (appleid.apple.com)
#   APPLE_TEAM_ID         10-char team id (e.g. from `security find-identity`)

name: Sign macOS release for upstream

on:
  schedule:
    - cron: "17 */2 * * *"   # poll upstream every 2h
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag to build (e.g. v0.9.0); empty = latest"
        required: false

env:
  UPSTREAM: HakanSeven12/OpenCADStudio

# Two overlapping polls would both pass the "already signed?" check and then
# race on `gh release create`. One signing run at a time.
concurrency:
  group: sign-macos-release
  cancel-in-progress: false

jobs:
  sign:
    runs-on: macos-14   # Apple Silicon, matches upstream release job
    timeout-minutes: 120   # notarytool --wait can hang; don't burn 6h on it
    permissions:
      contents: write   # create the release + tag on this fork
      issues: write     # report failed scheduled runs
    steps:
      - name: Find upstream release needing a signed build
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$UPSTREAM" --limit 1 \
                    --json tagName -q '.[0].tagName')
          fi
          [ -n "$TAG" ] || { echo "no upstream releases found"; exit 1; }
          # Idempotent poll: skip if this fork already has the signed release.
          if gh release view "$TAG-signed" --repo "${{ github.repository }}" \
               >/dev/null 2>&1; then
            echo "signed release for $TAG already exists — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout upstream tag
        if: steps.pick.outputs.skip == 'false'
        uses: actions/checkout@v5   # v4 runs on the deprecated Node 20
        with:
          repository: HakanSeven12/OpenCADStudio
          ref: ${{ steps.pick.outputs.tag }}

      - name: Check the tag can be signed
        id: guard
        if: steps.pick.outputs.skip == 'false'
        run: |
          set -euo pipefail
          if [ -f packaging/build_macos_signed.sh ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.pick.outputs.tag }} predates PR #405 and has no packaging/build_macos_signed.sh — nothing to sign." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Rust
        if: steps.guard.outputs.build == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install librsvg
        if: steps.guard.outputs.build == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install librsvg

      - name: Import signing certificate into ephemeral keychain
        if: steps.guard.outputs.build == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # An empty/unset secret decodes to an empty file and `security
          # import` then fails with an opaque "parameters were not valid".
          [ -n "$CERT_P12" ] || { echo "MACOS_CERT_P12 secret is empty"; exit 1; }
          KC=$RUNNER_TEMP/sign.keychain-db
          KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" \
            -P "$CERT_PW" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Store notary credentials
        if: steps.guard.outputs.build == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials ci-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      # Python 3.14's plistlib.load() seeks the stream to sniff the format, and
      # upstream's entitlements check pipes codesign's output straight into it:
      #   codesign -d --entitlements - ... | python3 -c '...plistlib.load(sys.stdin.buffer)...'
      # A pipe isn't seekable, so every build died with "File or stream is not
      # seekable" once the macos-14-arm64 image moved to 3.14 (2026-09-20).
      # loads(read()) is version-agnostic and keeps the assertion meaningful —
      # it still fails if the appex ever loses the sandbox entitlement.
      # Self-healing: a no-op once upstream's script carries the fix.
      - name: Patch upstream's plistlib call for Python 3.14
        if: steps.guard.outputs.build == 'true'
        run: |
          set -euo pipefail
          F=packaging/build_macos_signed.sh
          # Without this, a missing script makes `grep -q` fail, which an `if`
          # condition swallows — the step would then report "upstream fixed it"
          # and pass while nothing was checked.
          [ -f "$F" ] || { echo "$F is missing"; exit 1; }
          if grep -q 'plistlib\.load(sys\.stdin\.buffer)' "$F"; then
            perl -pi -e \
              's/plistlib\.load\(sys\.stdin\.buffer\)/plistlib.loads(sys.stdin.buffer.read())/g' \
              "$F"
            grep -q 'plistlib\.loads(sys\.stdin\.buffer\.read())' "$F" \
              || { echo "patch did not apply"; exit 1; }
            echo "Patched \`$F\` for Python 3.14 plistlib (upstream bug)." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Upstream no longer uses plistlib.load on a pipe — patch skipped." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build, sign, notarize
        if: steps.guard.outputs.build == 'true'
        env:
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          set -euo pipefail
          # No OCS_PATREON_TOKEN here on purpose — see header comment.
          VERSION="${TAG#v}" NOTARY_PROFILE=ci-notary \
            bash packaging/build_macos_signed.sh

      - name: Publish signed dmg as a release on this fork
        if: steps.guard.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          SRC="dist/OpenCADStudio-v$VERSION-macos-arm64.dmg"
          ASSET="OpenCADStudio-$TAG-macos-arm64-signed.dmg"
          cp "$SRC" "$ASSET"
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          # Mirror the upstream tag onto the fork (as "<tag>-signed") so the
          # release points at the exact source it was built from.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" \
            "HEAD:refs/tags/$TAG-signed" || true
          cat > notes.md <<EOF
          Developer-ID signed + notarized + stapled macOS arm64 build of
          [upstream $TAG](https://github.com/$UPSTREAM/releases/tag/$TAG),
          built unmodified from that tag by
          [this workflow](https://github.com/${{ github.repository }}/blob/main/.github/workflows/sign-macos-release.yml).

          Safe to re-host: the notarization ticket is stapled to the dmg, so it
          can be attached to the official upstream release as-is.

          Note: built without \`OCS_PATREON_TOKEN\` (that secret lives in the
          upstream repo), so Patreon-gated features are inactive in this build.
          EOF
          gh release create "$TAG-signed" \
            --repo "${{ github.repository }}" \
            --title "Signed macOS build of upstream $TAG" \
            --notes-file notes.md \
            --latest=false \
            "$ASSET" "$ASSET.sha256"

      - name: Clean up keychain
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true

      - name: Report failed scheduled run
        # A failing cron run is otherwise invisible unless the notification
        # email gets read. One open issue at a time, reused across failures.
        #
        # Reporting must never fail the job: this step erroring adds a second
        # red annotation next to the real one and makes the run page ambiguous
        # about what actually broke. It used to do exactly that on every run —
        # issues are disabled on forks by default, so `gh issue list` exited
        # non-zero and 69 consecutive failures went unreported. The summary is
        # written first and unconditionally, so the failure is recorded even
        # when the issue can't be filed.
        if: failure() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          TITLE="Signing workflow failing"
          BODY="Scheduled signing run for \`${TAG:-unknown tag}\` failed: $RUN"
          echo "## $TITLE" >> "$GITHUB_STEP_SUMMARY"
          echo "$BODY" >> "$GITHUB_STEP_SUMMARY"

          # Capture rather than test, so an api outage doesn't get reported as
          # "issues are disabled" — the two need different follow-up.
          ISSUES=$(gh repo view "${{ github.repository }}" \
                     --json hasIssuesEnabled -q .hasIssuesEnabled) || ISSUES="unknown"
          if [ "$ISSUES" != "true" ]; then
            echo "Could not file an issue (hasIssuesEnabled=$ISSUES) — reported in this summary only." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          NUM=$(gh issue list --repo "${{ github.repository }}" --state open \
                  --search "$TITLE in:title" --json number -q '.[0].number') || NUM=""
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" --body "$BODY"
          fi
