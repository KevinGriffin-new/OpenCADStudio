name: plan-JSON round-trip (import -> PDF)

# Cross-platform proof that the CAD leg of the plat2json pipeline is lossless:
# plan-JSON -> LS_IMPORTPLAN (real landsurvey plugin over IPC) -> document
# entities (1e-6) -> headless EXPORTPDF -> vector-content verification.
# The tests skip-to-green without their artifacts, so this workflow builds
# everything AND fails hard if a SKIP slips through (see the grep step).

on:
  push:
    branches: [feat/ls-roundtrip-test, main]
  pull_request:
  workflow_dispatch:

jobs:
  roundtrip:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plugin_lib: libopencad_landsurvey_plugin.so
            host_exe: OpenCADStudio
          - os: windows-latest
            plugin_lib: opencad_landsurvey_plugin.dll
            host_exe: OpenCADStudio.exe
          - os: macos-latest
            plugin_lib: libopencad_landsurvey_plugin.dylib
            host_exe: OpenCADStudio
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout OpenCADStudio
        uses: actions/checkout@v4

      - name: Checkout landsurvey plugin (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: KevinGriffin-new/opencad-landsurvey-plugin
          path: opencad-landsurvey-plugin

      - name: Linux build deps (headless build only — no display needed at runtime)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            opencad-landsurvey-plugin

      - name: Build landsurvey plugin cdylib
        working-directory: opencad-landsurvey-plugin
        run: cargo build

      - name: Build host binary (acts as the plugin runner)
        run: cargo build --bin OpenCADStudio

      - name: Run round-trip tests
        shell: bash
        env:
          OCS_LS_PLUGIN_DLL: ${{ github.workspace }}/opencad-landsurvey-plugin/target/debug/${{ matrix.plugin_lib }}
          OCS_PLUGIN_RUNNER_EXE: ${{ github.workspace }}/target/debug/${{ matrix.host_exe }}
          OCS_ROUNDTRIP_PDF_OUT: ${{ github.workspace }}/roundtrip-${{ matrix.os }}.pdf
        run: |
          cargo test --lib plan_roundtrip -- --nocapture 2>&1 | tee roundtrip-test.log

      - name: Fail on skip-to-green (a SKIP must never read as a pass here)
        shell: bash
        run: |
          if grep -q "SKIP plan_roundtrip" roundtrip-test.log; then
            echo "::error::round-trip tests SKIPPED — artifacts missing on this runner"
            exit 1
          fi
          grep -q "Loaded plugin: Land Survey" roundtrip-test.log || {
            echo "::error::no positive evidence the plugin actually loaded"; exit 1; }

      - name: Set up Python for the PDF checker
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exported PDF vector content
        shell: bash
        run: |
          python -m pip install --quiet pymupdf numpy
          python tools/check_roundtrip_pdf.py tests/fixtures/roundtrip_plan.json "roundtrip-${{ matrix.os }}.pdf"

      - name: Upload exported PDF (inspection artifact)
        uses: actions/upload-artifact@v4
        with:
          name: roundtrip-pdf-${{ matrix.os }}
          path: roundtrip-${{ matrix.os }}.pdf
